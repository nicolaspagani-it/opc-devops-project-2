<h2>Détail de l'étudiant</h2>

@if (loading) {
  <p>Chargement...</p>
}
@if (errorMessage) {
  <p class="text-danger">{{ errorMessage }}</p>
}

@if (student) {
  <p>Prénom : {{ student.firstName }}</p>
  <p>Nom : {{ student.lastName }}</p>
  <p>Email : {{ student.email }}</p>

  <a [routerLink]="['/students', student.id, 'edit']">Modifier</a>
  <button type="button" (click)="onDelete()">Supprimer</button>
}
<a routerLink="/students">Retour à la liste</a>
